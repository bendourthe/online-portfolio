<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Technical Communication</title>
<style>
  .communication-artifact,.communication-artifact *{box-sizing:border-box}
  .communication-artifact{display:grid;place-items:center;width:100%;min-height:100%;padding:0;background:var(--artifact-bg);font-family:"Segoe UI",Arial,sans-serif}
  .communication-artifact .artboard{width:min(100%,1200px);aspect-ratio:1/1;background:var(--artifact-bg)}
  .communication-artifact svg{display:block;width:100%;height:100%;overflow:visible}
  .communication-artifact text{font-family:"Segoe UI",Arial,sans-serif;fill:var(--artifact-title)}
  .communication-artifact .badgeText{font-size:var(--skill-graphic-badge-size);font-weight:var(--skill-graphic-badge-weight)}
  .communication-artifact .title{font-weight:var(--skill-graphic-title-weight);font-size:var(--skill-graphic-title-size);text-anchor:middle}
  .communication-artifact .smallTitle{font-weight:var(--skill-graphic-sub-title-weight);font-size:var(--skill-graphic-sub-title-size)}
  .communication-artifact .workflowTitle{font-size:var(--skill-graphic-section-size);font-weight:var(--skill-graphic-section-weight)}
  .communication-artifact .body{font-size:var(--skill-graphic-body-size);fill:var(--artifact-body)}
  .communication-artifact .stepText{font-size:var(--skill-graphic-label-size);font-weight:var(--skill-graphic-label-weight);fill:var(--workflow-text);letter-spacing:.1px}
  .communication-artifact .workflowCard{fill:var(--workflow-bg);stroke:var(--workflow-border);stroke-width:1.5}
  .communication-artifact .workflowArrow{fill:var(--workflow-arrow)}
  .communication-artifact{
    --artifact-bg:#eef8fa;
    --artifact-title:#123844;
    --artifact-body:#365965;
    --surface-top:#ffffff;
    --surface-bottom:#e6f3f6;
    --surface-solid:#f7fcfd;
    --surface-stroke:#168d9a;
    --workflow-bg:#f7fcfd;
    --workflow-border:#2399a5;
    --workflow-text:#173d48;
    --workflow-arrow:#168d9a;
    --workflow-title:#087782;
    --icon-panel:#d9eef2;
    --icon-mark:#0b6773;
  }
  @media (prefers-color-scheme:dark){
    .communication-artifact{
      --artifact-bg:#04171d;
      --artifact-title:#ffffff;
      --artifact-body:#d9e3e7;
      --surface-top:rgba(21,48,59,.80);
      --surface-bottom:rgba(7,28,37,.78);
      --surface-solid:rgba(12,38,48,.82);
      --surface-stroke:#48d0da;
      --workflow-bg:rgba(18,47,58,.82);
      --workflow-border:#55d5de;
      --workflow-text:#f8fcfd;
      --workflow-arrow:#71d5dc;
      --workflow-title:#4bd1da;
      --icon-panel:#061b24;
      --icon-mark:#ffffff;
    }
  }
  :host([data-theme='light']) .communication-artifact,
  html[data-theme='light'] .communication-artifact{
    --artifact-bg:#eef8fa;
    --artifact-title:#123844;
    --artifact-body:#365965;
    --surface-top:#ffffff;
    --surface-bottom:#e6f3f6;
    --surface-solid:#f7fcfd;
    --workflow-bg:#f7fcfd;
    --workflow-border:#2399a5;
    --workflow-text:#173d48;
    --workflow-arrow:#168d9a;
    --workflow-title:#087782;
    --icon-panel:#d9eef2;
    --icon-mark:#0b6773;
  }
  :host([data-theme='dark']) .communication-artifact,
  html[data-theme='dark'] .communication-artifact{
    --artifact-bg:#04171d;
    --artifact-title:#ffffff;
    --artifact-body:#d9e3e7;
    --surface-top:rgba(21,48,59,.80);
    --surface-bottom:rgba(7,28,37,.78);
    --surface-solid:rgba(12,38,48,.82);
    --workflow-bg:rgba(18,47,58,.82);
    --workflow-border:#55d5de;
    --workflow-text:#f8fcfd;
    --workflow-arrow:#71d5dc;
    --workflow-title:#4bd1da;
    --icon-panel:#061b24;
    --icon-mark:#ffffff;
  }
  .communication-artifact .outline{fill:url(#cardFill);stroke:#1db4c4;stroke-width:1.6}
  .communication-artifact .outlinePurple{fill:url(#cardFill);stroke:#7b63c7;stroke-width:1.6}
  .communication-artifact .outlineGreen{fill:url(#cardFill);stroke:#2aa98f;stroke-width:1.6}
  .communication-artifact .outlineOrange{fill:url(#cardFill);stroke:#ec891d;stroke-width:1.6}
  .communication-artifact .cyanStroke{fill:none;stroke:#39cbd5;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .communication-artifact .thinCyan{fill:none;stroke:#2dbac5;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .communication-artifact .paper{fill:url(#paper);stroke:#bfeaf5;stroke-width:2}
  .communication-artifact .theme-icon-panel{fill:var(--icon-panel)}
  .communication-artifact .theme-icon-mark-stroke{stroke:var(--icon-mark)}
  .communication-artifact .theme-icon-mark-fill{fill:var(--icon-mark)}
</style>
</head>
